apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch

  - nonResourceURLs:
      - /metrics
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s

    scrape_configs:
      # ==========================================
      # PROMETHEUS SELF-MONITORING
      # ==========================================
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # ==========================================
      # EXPENSY BACKEND
      # ==========================================
      - job_name: 'backend'
        metrics_path: /metrics
        static_configs:
          - targets: ['backend-service.default.svc.cluster.local:3000']

      # ==========================================
      # EXPENSY FRONTEND
      # ==========================================
      - job_name: 'frontend'
        metrics_path: /metrics
        static_configs:
          - targets: ['frontend-service.default.svc.cluster.local:3000']

      # ==========================================
      # MONGODB EXPORTER
      # ==========================================
      - job_name: 'mongo'
        static_configs:
          - targets: ['mongo-exporter.default.svc.cluster.local:9216']

      # ==========================================
      # REDIS EXPORTER
      # ==========================================
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter.default.svc.cluster.local:9121']

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
