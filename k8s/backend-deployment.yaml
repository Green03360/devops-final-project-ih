apiVersion: apps/v1
kind: Deployment
metadata:
  name: expensy-backend
  labels:
    app: expensy-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expensy-backend
  template:
    metadata:
      labels:
        app: expensy-backend
    spec:
      containers:
        - name: expensy-backend
          image: ucgreen/expensy-backend:latest
          ports:
            - containerPort: 8706
          env:
            - name: DATABASE_URI
              value: "mongodb://root:example@mongo:27017"
            - name: REDIS_PASSWORD
              value: "someredispassword"

